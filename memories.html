<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Little Universe 💗</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  font-family: Georgia, serif;
  color: white;
  text-align: center;
  background:
    radial-gradient(circle at center, #241044 0%, #100720 55%, #05020d 100%);
}

/* stars */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(circle, white 1px, transparent 1px),
    radial-gradient(circle, white 1px, transparent 1px);
  background-size: 90px 90px, 140px 140px;
  background-position: 10px 20px, 50px 80px;
  opacity: 0.45;
}

.title {
  position: relative;
  z-index: 2;
  padding-top: 45px;
}

.title small {
  letter-spacing: 6px;
  font-size: 12px;
  opacity: 0.7;
}

.title h1 {
  margin: 12px 0 8px;
  font-size: 38px;
}

.title p {
  margin: 0;
  font-size: 18px;
  opacity: 0.75;
}

/* galaxy */
.universe {
  position: relative;
  width: 100%;
  max-width: 600px;
  height: 570px;
  margin: auto;
}

/* orbit circles */
.universe::before,
.universe::after {
  content: "";
  position: absolute;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 50%;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
}

.universe::before {
  width: 330px;
  height: 330px;
}

.universe::after {
  width: 520px;
  height: 520px;
}

/* hearts */
.heart {
  position: absolute;
  z-index: 5;
  width: 70px;
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 62px;
  color: white;
  cursor: pointer;
  text-shadow: 0 0 18px #ff8fd8;
  animation: float 3s ease-in-out infinite;
  -webkit-tap-highlight-color: transparent;
}

.heart:active {
  transform: scale(0.8);
}

.heart1 {
  top: 18%;
  left: 13%;
}

.heart2 {
  top: 25%;
  right: 12%;
  animation-delay: .5s;
}

.heart3 {
  top: 47%;
  left: 42%;
  animation-delay: 1s;
}

.heart4 {
  bottom: 18%;
  left: 13%;
  animation-delay: 1.5s;
}

.heart5 {
  bottom: 10%;
  right: 15%;
  animation-delay: 2s;
}

.heart6 {
  top: 52%;
  right: 8%;
  animation-delay: 2.5s;
}

@keyframes float {
  0%, 100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-14px);
  }
}

/* center */
.center-heart {
  position: absolute;
  z-index: 3;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 75px;
  color: white;
  text-shadow: 0 0 25px #ff8fd8;
}

/* popup */
.message-box {
  display: none;
  position: fixed;
  z-index: 100;
  inset: 0;
  background: rgba(0,0,0,0.82);
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.message-box.show {
  display: flex;
}

.message-card {
  position: relative;
  width: 100%;
  max-width: 380px;
  max-height: 85vh;
  overflow-y: auto;
  padding: 20px;
  border-radius: 25px;
  background: #fff8fc;
  color: #4a2633;
  box-shadow: 0 0 35px rgba(255,150,220,0.35);
}

.message-card img {
  width: 100%;
  max-height: 55vh;
  object-fit: contain;
  border-radius: 18px;
  display: block;
  margin: auto;
}

.message-card h2 {
  margin-bottom: 8px;
}

.message-card p {
  font-size: 17px;
  line-height: 1.6;
}

.close {
  position: absolute;
  right: 12px;
  top: 8px;
  border: none;
  background: none;
  color: #4a2633;
  font-size: 32px;
  cursor: pointer;
}

/* next button */
.next-btn {
  position: relative;
  z-index: 10;
  display: inline-block;
  margin: 10px 0 35px;
  padding: 15px 28px;
  border-radius: 30px;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.2);
  color: white;
  text-decoration: none;
  font-size: 17px;
}
</style>
</head>

<body>

<div class="title">
  <small>WELCOME TO</small>
  <h1>Your Little Universe</h1>
  <p>Tap the hearts... 💗</p>
</div>

<div class="universe">

  <div class="heart heart1" onclick="showMessage('pic1')">♡</div>

  <div class="heart heart2" onclick="showMessage('pic2')">♡</div>

  <div class="heart heart3" onclick="showMessage('pic3')">♡</div>

  <div class="heart heart4" onclick="showMessage('pic4')">♡</div>

  <div class="heart heart5" onclick="showMessage('pic5')">♡</div>

  <div class="heart heart6" onclick="showMessage('pic6')">♡</div>

  <div class="center-heart">♡</div>

</div>

<div id="messageBox" class="message-box">

  <div class="message-card">

    <button class="close" onclick="closeMessage()">×</button>

    <div id="messageContent"></div>

  </div>

</div>

<a href="letter.html" class="next-btn">
  There's More... 💌
</a>

<script>

const messages = {

  pic1: "One of my favorite memories with you. 💗",

  pic2: "This moment will always have a special place in my heart. 🥹💗",

  pic3: "Look at you being adorable again. 🙄💗",

  pic4: "A memory I could look at a thousand times. 💕",

  pic5: "You make ordinary moments feel special. 💗",

  pic6: "And this one? Definitely keeping it forever. ♡"

};

function showMessage(photo) {

  document.getElementById("messageContent").innerHTML =
    "<img src='images/" + photo + ".jpg'>" +
    "<h2>💗</h2>" +
    "<p>" + messages[photo] + "</p>";

  document.getElementById("messageBox").classList.add("show");
}

function closeMessage() {

  document.getElementById("messageBox").classList.remove("show");

}

</script>

</body>
    </html>
